",label:"Observações sobre a dinâmica familiar",type:"textarea",porque:"Conflitos, mudanças recentes ou instabilidade familiar podem se manifestar como dificuldade de aprendizagem sem ser a causa primária."}]},{id:"gestacao",titulo:"Gestação e nascimento",descricao:"",campos:[{key:"gravidezPlanejada",label:"A gravidez foi planejada?",type:"options",opcoes:b,porque:"Contexto gestacional ajuda a entender o preparo emocional e os cuidados pré-natais recebidos."},{key:"intercorrencias",label:"Houve intercorrências na gestação?",type:"textarea",porque:"Intercorrências gestacionais (infecções, hipertensão, sangramentos etc.) são fatores de risco conhecidos para o neurodesenvolvimento."},{key:"preNatal",label:"Pré-natal foi realizado regularmente?",type:"options",opcoes:b,porque:"Pré-natal regular permite identificar e tratar precocemente condições que afetam o desenvolvimento do bebê."},{key:"usoMedicamentos",label:"Uso de medicamentos durante a gestação",type:"textarea",porque:"Alguns medicamentos e substâncias têm efeito conhecido sobre o desenvolvimento neurológico fetal."},{key:"tipoParto",label:"Tipo de parto",type:"options",opcoes:["Normal","Cesárea","Fórceps","Não sabe informar"],porque:"Partos com intercorrência (uso de fórceps, sofrimento fetal) podem estar associados a maior atenção ao desenvolvimento inicial."},{key:"idadeGestacional",label:"Idade gestacional ao nascer",type:"text",porque:"Bebês nascidos antes do termo têm maior chance de atrasos no desenvolvimento motor e de linguagem."},{key:"pesoNascer",label:"Peso ao nascer",type:"text",porque:"Baixo peso ao nascer é um indicador de risco para o desenvolvimento neuropsicomotor acompanhado na literatura."},{key:"prematuridade",label:"Houve prematuridade?",type:"options",opcoes:b,porque:"A prematuridade é um dos fatores de risco mais estudados para dificuldades de aprendizagem e atenção mais à frente."},{key:"internacoesNascimento",label:"Internações após o nascimento",type:"textarea",porque:"Internações neonatais (UTI, icterícia grave etc.) podem indicar eventos que merecem ser considerados na leitura do caso."},{key:"outrasInfoGestacao",label:"Outras informações",type:"textarea",porque:"Espaço livre para qualquer informação gestacional relevante que não se encaixe nos campos acima."}]},{id:"desenvolvimento",titulo:"Desenvolvimento",descricao:"",campos:[{key:"desenvolvimentoMotor",label:"Desenvolvimento motor geral",type:"textarea",porque:"O desenvolvimento motor é uma base para habilidades posteriores como escrita e organização espacial."},{key:"idadeSentar",label:"Idade em que sentou",type:"text",porque:"Atraso nos marcos motores (sentar por volta dos 6 meses) pode sinalizar necessidade de investigação neuromotora mais ampla."},{key:"idadeEngatinhar",label:"Idade em que engatinhou",type:"text",porque:"Engatinhar favorece a integração dos dois lados do corpo e do cérebro, relacionada depois à leitura e escrita; sua ausência ou atraso é um dado a observar."},{key:"idadeAndar",label:"Idade em que andou",type:"text",porque:"Andar por volta dos 12-18 meses é um marco motor clássico; atrasos relevantes podem justificar avaliação motora complementar."},{key:"coordenacaoMotora",label:"Coordenação motora",type:"textarea",porque:"Coordenação motora fina e global impacta diretamente grafomotricidade, esportes e autonomia nas atividades diárias."},{key:"desenvolvimentoLinguagem",label:"Desenvolvimento da linguagem",type:"textarea",porque:"Atrasos de linguagem na primeira infância são um dos preditores mais fortes de dificuldades posteriores de leitura e escrita."},{key:"primeirasPalavras",label:"Idade das primeiras palavras",type:"text",porque:"Primeiras palavras costumam surgir por volta dos 12 meses; atraso significativo é um marcador relevante para investigação de linguagem."},{key:"controleEsfincteres",label:"Controle dos esfíncteres",type:"textarea",porque:"A aquisição do controle esfincteriano reflete maturação neurológica geral e organização da rotina de autocuidado."},{k
